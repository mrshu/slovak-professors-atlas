[project]
name = "slovak-professors-atlas"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "xlrd>=2.0.2,<3",
]

[project.scripts]
atlas-data-build = "pipeline.build:main"

[dependency-groups]
dev = [
  "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
